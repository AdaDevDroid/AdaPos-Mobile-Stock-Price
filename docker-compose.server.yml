services:
  adapos-mobile-stock-price:
    image: adapos-mobile-stock-price:latest
    container_name: adapos-mobile-stock-price
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3001}
      NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-/AdaCheckStockSTD}
      NEXT_PUBLIC_VERSION: ${NEXT_PUBLIC_VERSION:-0.1.0}
    ports:
      - "${APP_PORT:-3001}:${PORT:-3001}"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    volumes:
      - adapos_runtime:/app/.runtime
      - adapos_next_cache:/app/.next/cache
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const base=process.env.NEXT_PUBLIC_BASE_PATH||'/AdaCheckStockSTD'; const port=process.env.PORT||3001; fetch('http://127.0.0.1:'+port+base+'/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1));"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  adapos_runtime:
  adapos_next_cache:
